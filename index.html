<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ziarno — palarnia kawy i herbaciarnia</title>
  <meta name="description" content="Makieta sklepu internetowego (frontend-only).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="promo-bar">Darmowa dostawa od 150 zł · To jest makieta — zamówienia nie są realizowane</div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">☕ Ziarno</a>
      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Szukaj produktów…" aria-label="Szukaj produktów">
      </form>
      <a href="#/konto" class="header-link" id="account-link" aria-label="Konto">
        👤 <span class="header-label" id="account-label">Zaloguj się</span>
      </a>
      <a href="#/koszyk" class="header-link cart-link" aria-label="Koszyk">
        🛒 <span class="header-label">Koszyk</span>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </a>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>☕ Ziarno</strong>
        <p>Makieta sklepu internetowego. Wszystkie produkty, ceny i zamówienia są fikcyjne.</p>
      </div>
      <div>
        <strong>Informacje</strong>
        <ul>
          <li><a href="#/">Katalog</a></li>
          <li><a href="#/koszyk">Koszyk</a></li>
          <li><a href="#/konto">Moje konto</a></li>
        </ul>
      </div>
      <div>
        <strong>Kontakt</strong>
        <p>kontakt@ziarno.example<br>+48 000 000 000</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
